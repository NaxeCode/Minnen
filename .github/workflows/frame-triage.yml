name: Frame Triage benchmark
on:
  pull_request:
    paths:
      - 'tools/frame-triage/**'
      - '.github/workflows/frame-triage.yml'
  push:
    branches: [master]
    paths:
      - 'tools/frame-triage/**'
      - '.github/workflows/frame-triage.yml'
permissions:
  contents: read
jobs:
  held-out-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/frame-triage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: python tools/render.py data --split test
      - run: node tools/extract.mjs data
      - run: node tools/verify-benchmark.mjs data
